name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: bash -n 1pup.sh

      - name: Validate embedded Python
        run: bash 1pup.sh --self-check
